name: Build Adownloader APK

on:
  push:
    branches: [ main, rebuild-gecko-v2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Read app version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore launcher icon
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          base64 -d ci/ic_launcher_xxxhdpi.webp.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
          file app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp

      - name: Build unsigned release APK
        run: gradle :app:assembleRelease --stacktrace

      - name: Rename unsigned release APK
        run: cp app/build/outputs/apk/release/app-release-unsigned.apk "Adownloader-v${APP_VERSION}-unsigned.apk"

      - name: Print unsigned APK digest
        run: sha256sum "Adownloader-v${APP_VERSION}-unsigned.apk"

      - name: Upload unsigned release artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adownloader-unsigned-v${{ env.APP_VERSION }}
          path: Adownloader-v${{ env.APP_VERSION }}-unsigned.apk

      # Publishing is intentionally disabled until the locally held fixed release key
      # signs this exact release artifact. The private key never enters this public repo.
