name: Build Adownloader APK

on:
  push:
    branches: [ main, rebuild-gecko-v2 ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Read app version
        run: |
          VERSION=$(sed -n 's/.*versionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -1)
          test -n "$VERSION"
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"

      - name: Restore launcher icon
        run: |
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          base64 -d ci/ic_launcher_xxxhdpi.webp.b64 > app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
          test -s app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp
          file app/src/main/res/mipmap-xxxhdpi/ic_launcher.webp

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk "Adownloader-v${APP_VERSION}.apk"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: Adownloader-APK-v${{ env.APP_VERSION }}
          path: Adownloader-v${{ env.APP_VERSION }}.apk

      - name: Publish rolling release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v${APP_VERSION}-build${{ github.run_number }}"
          gh release create "$TAG" "Adownloader-v${APP_VERSION}.apk" \
            --title "Adownloader v${APP_VERSION}" \
            --notes "GeckoView rebuild: self-contained browser engine, popup-first blocking, network WebExtension media detection and original-quality download pipeline."
