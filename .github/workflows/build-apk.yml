name: Build and verify Adownloader
on:
  push:
    branches: [main, rebuild-gecko-v2, rebuild-gecko-release, ui-ux-v050, reliability-v060, validation-v060, stabilize-v061, validation-v061, compatibility-v062, validation-v062, compatibility-v063, validation-v063]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
# A new push to the same PR supersedes the running verification (saves private-repo minutes).
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools build-tools;36.0.0 platforms;android-37.2'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Reserve runner space for the real 2 GiB transfer regression
        run: |
          # Android/Java do not use the runner's preinstalled .NET SDK.
          sudo rm -rf -- /usr/share/dotnet
          df -h "$GITHUB_WORKSPACE"
      - name: Unit tests, lint, ARM64 release
        run: |
          node ci/test-media-extension.cjs
          node ci/test-deep-detection.cjs
          node ci/test-content-extension.cjs
          node ci/test-session-context.cjs
          node ci/test-response-capture.cjs
          node ci/test-protected-transport.cjs
          git fetch --no-tags --depth=1 origin a13c305e91592daa8f617c09e97d29ce9640edcf
          node ci/benchmark-response-capture.cjs
          gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace
      - name: Print rendered UI for review (pull requests)
        if: always() && github.event_name == 'pull_request'
        run: |
          # Robolectric renders key layouts (LayoutRenderTest). Artifacts need a browser to view,
          # so the PNGs are also printed base64-encoded inside a collapsed group.
          for f in app/build/ui-render/*.png; do
            [ -f "$f" ] || continue
            echo "::group::UI-RENDER $(basename "$f")"
            echo "BEGIN-PNG $(basename "$f")"; base64 -w 0 "$f"; echo; echo "END-PNG"
            echo "::endgroup::"
          done
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true  # private-repo artifact quota must not fail verification
        with:
          retention-days: 3
          name: host-test-results
          path: |
            app/build/test-results/testDebugUnitTest/
            app/build/reports/tests/testDebugUnitTest/
            app/build/ui-render/
            app/build/reports/response-capture-*.json
      - name: Check packaged engine, ABI and launcher
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -l "$APK" | grep 'lib/arm64-v8a/libxul.so'
          unzip -l "$APK" | grep 'public_suffix_list.dat'
          if unzip -l "$APK" | grep -E 'lib/(x86|armeabi)'; then exit 1; fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep "launchable-activity: name='com.adownloader.app.MainActivity'" apk-badging.txt
          if grep -R -E 'import android.webkit|androidx.webkit|class (BrowserActivity|StableBrowserActivity|GeckoBrowserActivity)' app/src/main app/build.gradle.kts; then exit 1; fi
          sha256sum "$APK" > unsigned.sha256
      - uses: actions/upload-artifact@v7
        # ~200 MB per run: only keep the unsigned APK for main; releases are built by release.yml.
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        continue-on-error: true
        with:
          retention-days: 3
          name: Adownloader-unsigned-arm64
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            unsigned.sha256
            apk-badging.txt
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
  android-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools build-tools;36.0.0 platforms;android-37.2'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Generate synthetic test media
        timeout-minutes: 12
        run: |
          if ! command -v ffmpeg; then
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 update
            sudo apt-get -o Acquire::Retries=3 -o Acquire::http::Timeout=30 -o Acquire::https::Timeout=30 install -y ffmpeg
          fi
          bash ci/generate-test-fixtures.sh
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/run-android-tests.sh
      - uses: actions/upload-artifact@v7
        if: always()
        continue-on-error: true
        with:
          retention-days: 3
          name: android-integration-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ui-proof/
            ui-logcat.txt
            extension-performance.json
            process-recovery-results/
# This workflow never publishes. Signed releases come from release.yml (existing key, certificate-pinned).
