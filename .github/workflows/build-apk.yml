name: Build and verify Adownloader
on:
  push:
    branches: [main, rebuild-gecko-v2, rebuild-gecko-release, ui-ux-v050]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools build-tools;36.0.0 platforms;android-37.2'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Unit tests, lint, ARM64 release
        run: gradle :app:testDebugUnitTest :app:lintRelease :app:assembleRelease --stacktrace
      - name: Check packaged engine, ABI and launcher
        run: |
          APK=app/build/outputs/apk/release/app-release-unsigned.apk
          unzip -l "$APK" | grep 'lib/arm64-v8a/libxul.so'
          if unzip -l "$APK" | grep -E 'lib/(x86|armeabi)'; then exit 1; fi
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging "$APK" | tee apk-badging.txt
          grep "launchable-activity: name='com.adownloader.app.MainActivity'" apk-badging.txt
          if grep -R -E 'import android.webkit|androidx.webkit|class (BrowserActivity|StableBrowserActivity|GeckoBrowserActivity)' app/src/main app/build.gradle.kts; then exit 1; fi
          sha256sum "$APK" > unsigned.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: Adownloader-unsigned-arm64
          path: |
            app/build/outputs/apk/release/app-release-unsigned.apk
            unsigned.sha256
            apk-badging.txt
            app/build/reports/tests/
            app/build/reports/lint-results-release.html
  android-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: '13114758'
          packages: 'platform-tools build-tools;36.0.0 platforms;android-37.2'
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'
      - name: Generate synthetic test media
        run: |
          if ! command -v ffmpeg; then sudo apt-get update && sudo apt-get install -y ffmpeg; fi
          bash ci/generate-test-fixtures.sh
      - name: Enable KVM for emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          arch: x86_64
          target: google_apis
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash ci/run-android-tests.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: android-integration-results
          path: |
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            ui-proof/
            ui-logcat.txt
# The fixed private release key remains off GitHub. This workflow cannot publish an unsigned APK.

